<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#171717">
    <link rel="icon" href="../ilogo.PNG" type="image/PNG"> 

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../config.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/vendor/supabase-js.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

    <title>Company | Receipt Sender</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .input-box { border: 2px solid #f4f4f4; padding: 1rem; border-radius: 1.25rem; background: #fafafa; font-weight: 700; width: 100%; outline: none; transition: all 0.2s; }
        .input-box:focus { border-color: #b0b0b0; background: white; }
        .tab-active { background: #b0b0b0; color: #171717; box-shadow: 0 10px 15px -3px rgba(176, 176, 176, 0.3); }
        .badge { padding: 4px 8px; border-radius: 6px; font-weight: 900; font-size: 10px; text-transform: uppercase; }
        .badge-ready { background: #e8e8e8; color: #424242; }
        .badge-sent { background: #f0f0f0; color: #484848; }
        .badge-error { background: #eaeaea; color: #414141; }
        .badge-pending { background: #f1f1f1; color: #535353; }
        
        /* Universal Drag and Drop Effects */
        .drag-over {
            border-color: var(--drag-theme, #b0b0b0) !important;
            background-color: var(--drag-bg, rgba(176, 176, 176, 0.1)) !important;
        }
        .file-drop-zone * {
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-24 text-slate-900 font-medium">

    <nav class="bg-[#171717] text-white p-5 sticky top-0 z-50 shadow-xl border-b-2 border-slate-500">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <a href="../index.html" class="p-2 hover:bg-slate-800 rounded-lg text-slate-400 hover:text-white transition-all"><i data-lucide="arrow-left" class="w-5 h-5"></i></a>
                <h1 class="font-black italic text-xl uppercase tracking-tighter leading-none">COMPANY <span class="text-slate-500 uppercase text-xs">Receipts</span></h1>
            </div>
            <div class="flex bg-slate-800 p-1 rounded-xl gap-1 overflow-x-auto">
                <button onclick="switchTab('scan')" id="nav-scan" class="px-3 py-2 rounded-lg text-[9px] font-bold tab-active uppercase transition-all">Scan</button>
                <button onclick="switchTab('history')" id="nav-history" class="px-3 py-2 rounded-lg text-[9px] font-bold text-slate-400 uppercase transition-all">History</button>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-4 mt-6">
        <div id="tab-scan" class="space-y-6">
            <section class="bg-slate-900 p-6 rounded-[2.5rem] shadow-xl border-t-4 border-slate-500 text-white">
                <div class="flex justify-between items-center mb-4">
                    <div>
                        <h2 class="font-black uppercase text-[10px] tracking-widest text-slate-400 italic">Smart Scanner</h2>
                        <p class="text-[14px] font-bold">PDF Auto-Extraction</p>
                    </div>
                    <i data-lucide="sparkles" class="w-6 h-6 text-slate-400"></i>
                </div>
                <div class="flex gap-3">
                    <label id="drop-zone" for="pdf-file" class="file-drop-zone flex-1 bg-white/5 border-2 border-dashed border-slate-500 hover:border-slate-500 hover:bg-slate-500/10 p-8 rounded-2xl flex flex-col items-center justify-center cursor-pointer transition-all min-h-[140px]" style="--drag-theme: #b0b0b0; --drag-bg: rgba(176, 176, 176, 0.1);">
                        <i data-lucide="file-up" class="w-8 h-8 mb-3 text-slate-500"></i>
                        <span id="file-label" class="text-[11px] font-black uppercase tracking-widest text-center text-slate-300">Scan Merged Receipts (Drop PDF Here)<br><span class="text-[9px] font-medium text-slate-400 normal-case mt-1 inline-block">or click to browse your files</span></span>
                        <input type="file" id="pdf-file" accept="application/pdf" class="hidden" onchange="if(this.files[0]) { document.getElementById('file-label').innerText = this.files[0].name; processFiles(); }">
                    </label>
                </div>
            </section>

            <section id="results-section" class="hidden bg-white p-6 rounded-[2rem] shadow-sm border space-y-4">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="font-black uppercase text-[10px] tracking-widest text-slate-400 italic">Processing Queue</h2>
                    <button onclick="sendAllReceipts()" class="bg-slate-500 text-[#171717] px-4 py-2 rounded-xl font-black text-[10px] uppercase flex items-center gap-1 shadow-sm"><i data-lucide="send" class="w-3 h-3"></i> Send All Emails</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-slate-100 text-slate-400 text-[9px] uppercase font-black tracking-widest">
                            <tr>
                                <th class="p-3 rounded-tl-xl">Issuer</th>
                                <th class="p-3">Receipt No</th>
                                <th class="p-3">Customer</th>
                                <th class="p-3">Email Address</th>
                                <th class="p-3">Status</th>
                                <th class="p-3 text-center rounded-tr-xl">Action</th>
                            </tr>
                        </thead>
                        <tbody id="queue-body" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </section>
        </div>

        <div id="tab-history" class="hidden space-y-4">
            <section class="bg-white p-6 rounded-[2rem] shadow-sm border space-y-4">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="font-black uppercase text-[10px] tracking-widest text-slate-400 italic">Sent Receipts History</h2>
                    <button onclick="loadHistory()" class="bg-slate-100 text-slate-600 px-3 py-2 rounded-xl font-black text-[9px] uppercase flex items-center gap-1"><i data-lucide="refresh-cw" class="w-3 h-3"></i> Refresh</button>
                </div>
                <div id="history-list" class="space-y-3"></div>
            </section>
        </div>
        <footer class="text-center py-4 mt-6">
        <p class="text-[9px] font-black uppercase tracking-[0.6em] text-slate-400">© 2026 ALL RIGHTS RESERVED.</p>
    </footer>
</main>

    <script>
        const SUPABASE_URL = 'https://YOUR_PROJECT_REF.supabase.co';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Approval gate: only admins or staff-table members may use this module.

        // AI calls now go through our own server-side proxy (key stays on the server).
        const GEMINI_PROXY = '/api/gemini';
        async function aiAuthHeaders(extra = {}) {
            const { data: { session } } = await supabaseClient.auth.getSession();
            return { 'Authorization': `Bearer ${session?.access_token || ''}`, ...extra };
        }

        // Pick the best available model, falling back if a preview model is retired.
        async function getWorkingModel() {
            const preferred = ["gemini-3-flash-preview", "gemini-flash-latest", "gemini-2.5-flash"];
            try {
                const res = await fetch(`${GEMINI_PROXY}/v1beta/models`, { headers: await aiAuthHeaders() });
                const data = await res.json();
                for (const p of preferred) {
                    const m = data.models.find(mod => mod.name.includes(p) && mod.supportedGenerationMethods.includes("generateContent"));
                    if (m) return m.name;
                }
                const m = data.models.find(mod => mod.name.includes("flash") && mod.supportedGenerationMethods.includes("generateContent"));
                return m ? m.name : "models/gemini-3-flash-preview";
            } catch (e) { return "models/gemini-3-flash-preview"; }
        }
        
        let customerDB = [];
        let receiptsQueue = [];

        function safeUint8ToBase64(uint8) {
            let binary = '';
            for (let i = 0; i < uint8.byteLength; i++) { binary += String.fromCharCode(uint8[i]); }
            return window.btoa(binary);
        }

        async function init() {
            lucide.createIcons();
            await fetchMasterDatabase();

            // --- ADDED DRAG AND DROP EVENT LISTENERS (Foolproof Version) ---
            const dropZone = document.getElementById('drop-zone');
            if(dropZone) {
                // Prevent default behaviors so the browser allows dropping
                ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                    dropZone.addEventListener(eventName, (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                    }, false);
                });

                // Add the yellow highlight when dragging over
                ['dragenter', 'dragover'].forEach(eventName => {
                    dropZone.addEventListener(eventName, () => {
                        dropZone.classList.add('drag-over');
                    }, false);
                });

                // Remove the highlight when dragging leaves or drops
                ['dragleave', 'drop'].forEach(eventName => {
                    dropZone.addEventListener(eventName, () => {
                        dropZone.classList.remove('drag-over');
                    }, false);
                });

                // Handle the actual file drop
                dropZone.addEventListener('drop', (e) => {
                    if(e.dataTransfer.files.length) {
                        const fileInput = document.getElementById('pdf-file');
                        fileInput.files = e.dataTransfer.files;
                        document.getElementById('file-label').innerText = e.dataTransfer.files[0].name;
                        processFiles();
                    }
                });
            }
        }

        function switchTab(tabId) {
            ['scan', 'history'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`nav-${t}`).className = 'px-3 py-2 rounded-lg text-[9px] font-bold text-slate-400 uppercase transition-all';
            });
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            document.getElementById(`nav-${tabId}`).className = 'px-3 py-2 rounded-lg text-[9px] font-bold tab-active uppercase transition-all';
            if (tabId === 'history') loadHistory();
        }

        // Hidden Database Fetch - Needed to match emails
        async function fetchMasterDatabase() {
            try {
                const { data, error } = await supabaseClient.from('customers').select('company_name, email_address');
                if (error) throw error;
                customerDB = data.map(c => ({ name: c.company_name, email: c.email_address }));
            } catch (err) { console.error("Could not load customer DB to cross-reference emails"); }
        }

        function matchEmail(name) {
            if(!name || customerDB.length === 0) return '';
            const clean = (s) => String(s).toLowerCase().replace(/sdn\.?\s*bhd\.?/g, '').replace(/[^a-z0-9]/g, '');
            const target = clean(name);
            const match = customerDB.find(c => {
                const db = clean(c.name);
                return db.length > 3 && (target.includes(db) || db.includes(target));
            });
            return match ? match.email : '';
        }

        async function processFiles() {
            const file = document.getElementById('pdf-file').files[0];
            if (!file) return alert("Select PDF.");
            const label = document.getElementById('file-label');
            const dropZone = document.getElementById('drop-zone');
            dropZone.style.pointerEvents = 'none';
            try {
                const pdfBytes = await file.arrayBuffer();
                const pdfDoc = await PDFLib.PDFDocument.load(pdfBytes);
                const pages = pdfDoc.getPages();
                document.getElementById('results-section').classList.remove('hidden');
                const tbody = document.getElementById('queue-body');
                tbody.innerHTML = ''; receiptsQueue = [];
                const modelName = await getWorkingModel();
                for (let i = 0; i < pages.length; i++) {
                    label.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin inline-block"></i> Scanning (${i+1}/${pages.length})...`;
                    lucide.createIcons();
                    const single = await PDFLib.PDFDocument.create();
                    const [page] = await single.copyPages(pdfDoc, [i]);
                    single.addPage(page);
                    const b64 = safeUint8ToBase64(await single.save());
                    const res = await fetch(`${GEMINI_PROXY}/v1beta/${modelName}:generateContent`, {
                        method: "POST", headers: await aiAuthHeaders({ "Content-Type": "application/json" }),
                        body: JSON.stringify({ contents: [{ parts: [{ text: `Extract ONLY JSON. Keys: "issuer", "receipt_no", "customer_name", "description".` }, { inline_data: { mime_type: "application/pdf", data: b64 } }] }] })
                    });
                    const jsonRes = await res.json();
                    let rawText = jsonRes.candidates[0].content.parts[0].text;
                    rawText = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();
                    const ext = JSON.parse(rawText);
                    const email = matchEmail(ext.customer_name);
                    const item = { id: i, base64: b64, ...ext, email, status: email ? 'Ready' : 'Pending' };
                    receiptsQueue.push(item);
                    tbody.innerHTML += `
                        <tr id="row-${i}" class="hover:bg-slate-50 transition-colors border-b border-slate-50">
                            <td class="p-3 text-[9px] font-bold text-slate-400 uppercase">${item.issuer || '-'}</td>
                            <td class="p-3 text-[11px] font-black text-slate-800">${item.receipt_no || '-'}</td>
                            <td class="p-3 text-[10px] font-bold text-slate-600">${item.customer_name || '-'}</td>
                            <td class="p-3"><input type="email" value="${item.email}" onchange="updateRow(${i}, this.value)" class="w-full bg-slate-100 border-none p-2 rounded-lg text-[10px] font-bold focus:ring-2 focus:ring-slate-500 outline-none"></td>
                            <td class="p-3"><span id="stat-${i}" class="badge ${item.status === 'Ready' ? 'badge-ready' : 'badge-pending'}">${item.status}</span></td>
                            <td class="p-3 text-center flex gap-1 justify-center">
                                <button onclick="sendSingleRow(${i})" class="text-slate-500 hover:bg-slate-50 p-2 rounded-lg transition-all"><i data-lucide="send" class="w-4 h-4"></i></button>
                                <button onclick="viewPDF(${i})" class="text-slate-500 hover:bg-slate-50 p-2 rounded-lg transition-all"><i data-lucide="eye" class="w-4 h-4"></i></button>
                                <button onclick="document.getElementById('row-${i}').remove()" class="text-slate-400 hover:bg-slate-50 p-2 rounded-lg transition-all"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            </td>
                        </tr>`;
                    lucide.createIcons();
                }
            } catch (e) { alert("Processing Error: " + e.message); }
            finally { label.innerText = file.name; dropZone.style.pointerEvents = 'auto'; lucide.createIcons(); }
        }

        function updateRow(id, mail) {
            const item = receiptsQueue.find(x => x.id === id);
            if(!item) return;
            item.email = mail; item.status = mail ? 'Ready' : 'Pending';
            const b = document.getElementById(`stat-${id}`);
            if(b) { b.innerText = item.status; b.className = `badge ${mail ? 'badge-ready' : 'badge-pending'}`; }
        }

        function viewPDF(id) {
            const item = receiptsQueue.find(i => i.id === id);
            const blob = new Blob([new Uint8Array(atob(item.base64).split("").map(c => c.charCodeAt(0)))], { type: "application/pdf" });
            const url = URL.createObjectURL(blob); window.open(url, "_blank");
        }

        async function sendSingleRow(id) {
            const item = receiptsQueue.find(x => x.id === id);
            if (!item || item.status !== 'Ready') return alert("Row is not ready or missing email.");
            const b = document.getElementById(`stat-${id}`); 
            if(b) { b.innerText = "Sending..."; b.className = "badge badge-pending"; }
            try {
                const response = await fetch(`${SUPABASE_URL}/functions/v1/send-receipt`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_KEY}` },
                    body: JSON.stringify({ to: item.email, customer_name: item.customer_name, receipt_no: item.receipt_no || 'UNKNOWN', issuer: item.issuer || 'COMPANY', pdfBase64: item.base64 })
                });
                if (!response.ok) throw new Error("Send failed");
                if(b) { b.innerText = "Sent"; b.className = "badge badge-sent"; }
                item.status = "Sent";
                await supabaseClient.from('receipt_logs').insert({ issuer: item.issuer || '-', receipt_no: String(item.receipt_no || '-'), customer_name: item.customer_name || '-', email_address: item.email || '-', status: 'Sent' });
            } catch (e) { 
                if(b) { b.innerText = "Error"; b.className = "badge badge-error"; } 
                alert("Error: " + e.message);
            }
        }

        async function sendAllReceipts() {
            const toSend = receiptsQueue.filter(x => x.status === 'Ready');
            if(toSend.length === 0) return alert("Nothing ready.");
            for (const item of toSend) { await sendSingleRow(item.id); }
        }

        async function loadHistory() {
            const container = document.getElementById('history-list');
            container.innerHTML = `<p class="text-center text-xs text-slate-400 italic">Loading records...</p>`;
            try {
                const { data, error } = await supabaseClient.from('receipt_logs').select('*').order('sent_at', { ascending: false }).limit(30);
                if (error) throw error;
                if (data.length === 0) return container.innerHTML = `<p class="text-center text-xs text-slate-400 italic">No history found.</p>`;
                container.innerHTML = data.map(log => {
                    const d = new Date(log.sent_at);
                    const fd = d.toLocaleDateString('en-GB') + ' ' + d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    return `<div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 flex justify-between items-center group">
                                <div><h3 class="font-black text-slate-800 text-sm tracking-tight">${log.receipt_no || '-'}</h3><p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">${log.customer_name} | ${fd}</p></div>
                                <div class="badge-sent px-3 py-1 rounded-full text-[8px] font-black uppercase tracking-widest">${log.status}</div>
                            </div>`;
                }).join('');
            } catch (e) { container.innerHTML = `<p class="text-center text-xs text-slate-400">History Error.</p>`; }
        }

        window.onload = init;
    </script>
</body>
</html>
