<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#171717">
    <link rel="icon" href="../ilogo.PNG" type="image/PNG"> 

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../config.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/vendor/supabase-js.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

    <title>Company | Customer Database</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .input-box { border: 2px solid #f4f4f4; padding: 0.75rem 1rem; border-radius: 1rem; background: #fafafa; font-weight: 700; width: 100%; outline: none; transition: all 0.2s; font-size: 0.875rem; }
        .input-box:focus { border-color: #808080; background: white; }

        /* Universal Drag and Drop Effects */
        .drag-over {
            border-color: var(--drag-theme, #808080) !important;
            background-color: var(--drag-bg, rgba(128, 128, 128, 0.1)) !important;
        }
        .file-drop-zone * {
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-24 text-slate-900 font-medium relative">

    <nav class="bg-[#171717] text-white p-5 sticky top-0 z-50 shadow-xl border-b-2 border-slate-500">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <a href="../index.html" class="p-2 hover:bg-slate-800 rounded-lg text-slate-400 hover:text-white transition-all"><i data-lucide="arrow-left" class="w-5 h-5"></i></a>
                <h1 class="font-black italic text-xl uppercase tracking-tighter leading-none">COMPANY <span class="text-slate-500 uppercase text-xs">Customers</span></h1>
            </div>
            <button onclick="openModal()" class="bg-slate-500 hover:bg-slate-400 text-[#171717] px-4 py-2 rounded-xl font-black text-[10px] uppercase flex items-center gap-2 transition-all shadow-sm">
                <i data-lucide="plus" class="w-4 h-4"></i> New Client
            </button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-4 mt-6 space-y-6">
        

        <section class="bg-white p-6 rounded-[2rem] shadow-sm border space-y-4">
            <div class="flex justify-between items-center mb-4">
                <h2 class="font-black uppercase text-[10px] tracking-widest text-slate-400 italic">Customer Directory</h2>
                <div class="relative w-64">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-2.5 text-slate-400"></i>
                    <input type="text" id="search-input" onkeyup="filterTable()" placeholder="Search clients..." class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-9 pr-4 py-2 text-xs font-bold outline-none focus:border-slate-500 transition-colors">
                </div>
            </div>
            <div class="overflow-x-auto rounded-xl border border-slate-100">
                <table class="w-full text-left whitespace-nowrap">
                    <thead class="bg-slate-50 text-slate-400 text-[9px] uppercase font-black tracking-widest border-b border-slate-100">
                        <tr>
                            <th class="p-4 text-center w-12">No.</th>
                            <th class="p-4 min-w-[120px]">Company Name</th>
                            <th class="p-4 min-w-[240px]">Address</th>
                            <th class="p-4 w-56">PIC</th>
                            <th class="p-4 w-56">Contact</th>
                            <th class="p-4 min-w-[150px]">Email</th>
                            <th class="p-4 min-w-[150px]">Remarks</th>
                            <th class="p-4 text-center w-24">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="customer-table-body" class="divide-y divide-slate-100">
                        <tr><td colspan="8" class="p-8 text-center text-xs text-slate-400 italic">Loading database...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
        <footer class="text-center py-4 mt-6">
        <p class="text-[9px] font-black uppercase tracking-[0.6em] text-slate-400">© 2026 ALL RIGHTS RESERVED.</p>
    </footer>
</main>

    <div id="customer-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-[100] p-4">
        <div class="bg-white w-full max-w-lg rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="bg-slate-900 p-6 flex justify-between items-center text-white shrink-0">
                <div>
                    <h2 id="modal-title" class="font-black italic uppercase tracking-widest text-slate-400 text-xs">Add Customer</h2>
                </div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white transition-colors"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            
            <div class="p-6 overflow-y-auto space-y-4 flex-1">
                <input type="hidden" id="form-id">
                
                <div class="space-y-1">
                    <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-2">Company Name</label>
                    <input type="text" id="form-name" class="input-box" required>
                </div>

                <div class="space-y-1">
                    <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-2">Address</label>
                    <textarea id="form-address" class="input-box min-h-[80px]" rows="3"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-2">PIC</label>
                        <input type="text" id="form-pic" class="input-box">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-2">Contact (H/P)</label>
                        <input type="text" id="form-hp" class="input-box">
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-2">Email Address</label>
                    <input type="email" id="form-email" class="input-box">
                </div>

                <div class="space-y-1">
                    <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-2">Remarks</label>
                    <input type="text" id="form-remark" class="input-box">
                </div>
            </div>

            <div class="p-6 bg-slate-50 border-t border-slate-100 flex gap-3 shrink-0">
                <button onclick="closeModal()" class="flex-1 bg-white border-2 border-slate-200 text-slate-500 font-black py-4 rounded-2xl uppercase tracking-widest text-[10px] hover:border-slate-300 transition-all">Cancel</button>
                <button onclick="saveCustomer()" id="save-btn" class="flex-1 bg-slate-500 text-white font-black py-4 rounded-2xl uppercase tracking-widest text-[10px] shadow-lg hover:bg-slate-600 transition-all">Save Record</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://YOUR_PROJECT_REF.supabase.co';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Approval gate: only admins or staff-table members may use this module.

        let customerDB = [];
        let liveDatabase = []; 

        async function init() {
            lucide.createIcons();
            
            await fetchCustomers();
        }

        async function fetchCustomers() {
            try {
                const { data, error } = await supabaseClient.from('customers').select('*').order('company_name');
                if (error) throw error;
                liveDatabase = data || [];
                renderTable();
            } catch (err) { console.error("Database Load Error:", err); }
        }

        function renderTable(dataToRender = liveDatabase) {
            const tbody = document.getElementById('customer-table-body');
            tbody.innerHTML = '';
            if (dataToRender.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-8 text-center text-xs text-slate-400 italic">No customers found.</td></tr>`;
                return;
            }

            dataToRender.forEach((c, index) => {
                const row = document.createElement('tr');
                row.className = "hover:bg-slate-50 transition-colors";
                
                // Adjusted min-w and max-w for Company Name, PIC, and Contact
                row.innerHTML = `
                    <td class="p-4 text-[10px] font-bold text-slate-400 text-center">${index + 1}</td>
                    <td class="p-4">
                        <p class="text-[11px] font-black text-slate-800 break-words whitespace-normal min-w-[100px] max-w-[180px]">${c.company_name || '-'}</p>
                    </td>
                    <td class="p-4 text-[10px] text-slate-600 whitespace-normal min-w-[200px] max-w-[320px] leading-relaxed">${c.address || '-'}</td>
                    <td class="p-4 text-[10px] font-bold text-slate-600 whitespace-normal break-words max-w-[240px]">${c.pic || '-'}</td>
                    <td class="p-4 text-[10px] font-bold text-slate-600 whitespace-normal break-words max-w-[240px]">${c.hp || '-'}</td>
                    <td class="p-4 text-[10px] font-bold text-slate-600 whitespace-normal break-all min-w-[150px] max-w-[200px]">${c.email_address || '-'}</td>
                    <td class="p-4 text-[10px] text-slate-500 whitespace-normal min-w-[150px] max-w-[200px]">${c.remark || '-'}</td>
                    <td class="p-4 text-center">
                        <div class="flex justify-center gap-2">
                            <button onclick='editCustomer(${JSON.stringify(c).replace(/'/g, "&#39;")})' class="bg-slate-50 text-slate-600 hover:bg-slate-100 p-2 rounded-lg transition-all"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                            <button onclick="deleteCustomer(${c.id})" class="bg-slate-50 text-slate-500 hover:bg-slate-100 p-2 rounded-lg transition-all"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
            lucide.createIcons();
        }

        function filterTable() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = liveDatabase.filter(c => 
                (c.company_name && c.company_name.toLowerCase().includes(query)) ||
                (c.pic && c.pic.toLowerCase().includes(query)) ||
                (c.email_address && c.email_address.toLowerCase().includes(query)) ||
                (c.remark && c.remark.toLowerCase().includes(query))
            );
            renderTable(filtered);
        }

        function openModal() {
            document.getElementById('form-id').value = '';
            document.getElementById('form-name').value = '';
            document.getElementById('form-address').value = '';
            document.getElementById('form-pic').value = '';
            document.getElementById('form-hp').value = '';
            document.getElementById('form-email').value = '';
            document.getElementById('form-remark').value = '';
            document.getElementById('modal-title').innerText = "Add Customer";
            document.getElementById('customer-modal').style.display = 'flex';
        }

        function editCustomer(c) {
            document.getElementById('form-id').value = c.id;
            document.getElementById('form-name').value = c.company_name || '';
            document.getElementById('form-address').value = c.address || '';
            document.getElementById('form-pic').value = c.pic || '';
            document.getElementById('form-hp').value = c.hp || '';
            document.getElementById('form-email').value = c.email_address || '';
            document.getElementById('form-remark').value = c.remark || '';
            document.getElementById('modal-title').innerText = "Edit Customer";
            document.getElementById('customer-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('customer-modal').style.display = 'none';
        }

        async function saveCustomer() {
            const id = document.getElementById('form-id').value;
            const name = document.getElementById('form-name').value.trim();
            if(!name) return alert("Company Name is required.");

            const payload = {
                company_name: name,
                address: document.getElementById('form-address').value,
                pic: document.getElementById('form-pic').value,
                hp: document.getElementById('form-hp').value,
                email_address: document.getElementById('form-email').value,
                remark: document.getElementById('form-remark').value
            };

            const btn = document.getElementById('save-btn');
            btn.innerText = "Saving..."; btn.disabled = true;

            try {
                let error;
                if (id) {
                    const res = await supabaseClient.from('customers').update(payload).eq('id', id);
                    error = res.error;
                } else {
                    const res = await supabaseClient.from('customers').insert(payload);
                    error = res.error;
                }
                if (error) throw error;
                closeModal();
                await fetchCustomers();
            } catch (err) {
                alert("Error saving record: " + err.message);
            } finally {
                btn.innerText = "Save Record"; btn.disabled = false;
            }
        }

        async function deleteCustomer(id) {
            if(!confirm("Are you sure you want to delete this customer?")) return;
            try {
                const { error } = await supabaseClient.from('customers').delete().eq('id', id);
                if (error) throw error;
                await fetchCustomers();
            } catch (err) {
                alert("Error deleting record: " + err.message);
            }
        }

        window.onload = init;
    </script>
</body>
</html>
