name: Prevent Supabase Pause

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    # This ensures multiple activity logs per day
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PROJECT_ID: YOUR_PROJECT_REF
        run: |
          echo "Pinging Supabase Project: $PROJECT_ID..."
          
          RESPONSE_FILE=$(mktemp)
          
          # Query a real table so this registers as genuine database activity
          # (a plain /rest/v1/ ping only returns 401 and never touches the DB).
          HTTP_STATUS=$(curl -s -w "%{http_code}" \
            -o "$RESPONSE_FILE" \
            -X GET "https://$PROJECT_ID.supabase.co/rest/v1/staff?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")

          RESPONSE_BODY=$(cat "$RESPONSE_FILE")

          # A real query returns 200; still accept 2xx-4xx so a transient auth
          # blip never fails the safeguard, but log anything that isn't 200.
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Success! Database queried. Status: 200"
          elif [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 500 ]; then
            echo "Reached Supabase (Status: $HTTP_STATUS) — activity logged, but query did not return 200."
            echo "Details: $RESPONSE_BODY"
          else
            echo "FAILED! Status: $HTTP_STATUS"
            echo "Details: $RESPONSE_BODY"
            exit 1
          fi
