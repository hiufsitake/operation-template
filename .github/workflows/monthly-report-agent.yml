name: Monthly Report Agent

on:
  schedule:
    # 10:00 UTC = 18:00 MYT, runs on days 28–31; script checks if today is the last day
    - cron: '0 10 28-31 * *'
  workflow_dispatch:
    inputs:
      month:
        description: 'Override month to report (YYYY-MM). Leave blank for current month.'
        required: false
        type: string

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Install reportlab
        run: pip install reportlab -q

      - name: Generate PDF and Email Monthly Report
        env:
          SUPABASE_URL: https://YOUR_PROJECT_REF.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_KEY }}
          REPORT_RECIPIENT: admin1@example.com
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, urllib.error, sys, os, base64
          from datetime import date, timedelta
          from reportlab.lib.pagesizes import A4
          from reportlab.lib import colors
          from reportlab.lib.units import mm
          from reportlab.lib.styles import ParagraphStyle
          from reportlab.lib.enums import TA_LEFT, TA_RIGHT, TA_CENTER
          from reportlab.platypus import (SimpleDocTemplate, Table, TableStyle,
                                           Paragraph, Spacer, HRFlowable, KeepTogether)

          # ── Date logic ────────────────────────────────────────────────────────
          override = "${{ github.event.inputs.month }}".strip()
          if override:
              yr, mo   = map(int, override.split("-"))
              today    = date(yr, mo, 1)
          else:
              today    = date.today()
              tomorrow = today + timedelta(days=1)
              if tomorrow.day != 1:
                  print(f"Today is {today} — not last day of month. Skipping.")
                  sys.exit(0)

          month_start = today.strftime("%Y-%m-01")
          first_next  = (today.replace(day=1) + timedelta(days=32)).replace(day=1)
          month_end   = first_next.strftime("%Y-%m-%d")
          month_label = today.strftime("%B %Y")
          filename    = f"/tmp/COMPANY-Monthly-Report-{today.strftime('%Y-%m')}.pdf"
          print(f"Generating report for {month_label}")

          # ── Supabase ──────────────────────────────────────────────────────────
          BASE = os.environ['SUPABASE_URL'] + "/rest/v1"
          KEY  = os.environ['SUPABASE_SERVICE_KEY']
          ANON = os.environ['SUPABASE_ANON_KEY']
          HDR  = {"apikey": KEY, "Authorization": f"Bearer {KEY}"}

          def fetch(table, dc, extra=""):
              url = f"{BASE}/{table}?select=*&{dc}=gte.{month_start}&{dc}=lt.{month_end}{extra}&limit=1000"
              req = urllib.request.Request(url, headers=HDR)
              with urllib.request.urlopen(req) as r: return json.loads(r.read())
          def fetch_all(t):
              req = urllib.request.Request(f"{BASE}/{t}?select=*&limit=1000", headers=HDR)
              with urllib.request.urlopen(req) as r: return json.loads(r.read())
          def fmt(n): return f"RM {float(n or 0):,.2f}"

          pos    = fetch("po_logs",       "po_date")
          ccs    = fetch("cash_claims",   "submission_date")
          scs    = fetch("staff_claims",  "submission_date")
          leaves = fetch("logs",          "start_date", "&status=eq.Approved")
          costs  = fetch("project_costs", "date")
          staff  = fetch_all("staff")
          staff_map = {s["id"]: s["name"] for s in staff}
          po_total  = sum(float(r.get("total_amount") or 0) for r in pos)
          cc_total  = sum(float(r.get("total_amount") or 0) for r in ccs)
          sc_total  = sum(float(r.get("total_amount") or 0) for r in scs)
          lv_days   = sum(float(r.get("days")         or 0) for r in leaves)
          pcm_total = sum(float(r.get("amount")        or 0) for r in costs)
          grand     = po_total + cc_total + sc_total + pcm_total
          print(f"Data: {len(pos)} POs | {len(ccs)} CC | {len(scs)} SC | {len(leaves)} leave | {len(costs)} PCM")

          # ── PDF helpers ───────────────────────────────────────────────────────
          W, H = A4; MARGIN = 18*mm; TW = W - 2*MARGIN
          NAVY=colors.HexColor("#0f172a"); INDIGO=colors.HexColor("#6366f1")
          EMERALD=colors.HexColor("#10b981"); BLUE=colors.HexColor("#3b82f6")
          PURPLE=colors.HexColor("#a855f7"); SLATE=colors.HexColor("#64748b")
          AMBER=colors.HexColor("#78350f"); WHITE=colors.white
          STRIPE=colors.HexColor("#f8fafc"); BORDER=colors.HexColor("#e2e8f0")

          def S(name, **kw): return ParagraphStyle(name, **kw)
          def cell(txt, bold=False, align=TA_LEFT, color=NAVY, size=8):
              return Paragraph(str(txt), S("c", fontName="Helvetica-Bold" if bold else "Helvetica",
                                           fontSize=size, textColor=color, leading=size+2, alignment=align))
          def badge_cell(status):
              cfg = {"Approved": ("#166534","#dcfce7"), "Pending": ("#92400e","#fef3c7"),
                     "Rejected": ("#991b1b","#fee2e2")}
              fg, bg = cfg.get(status, ("#334155","#e2e8f0"))
              return Paragraph(status, S("b", fontName="Helvetica-Bold", fontSize=7,
                                          textColor=colors.HexColor(fg), leading=9, alignment=TA_CENTER))
          def make_table(cws, hdr, rows, accent=NAVY):
              t = Table([hdr]+rows, colWidths=cws, repeatRows=1)
              t.setStyle(TableStyle([
                  ("BACKGROUND",(0,0),(-1,0),accent),("TEXTCOLOR",(0,0),(-1,0),WHITE),
                  ("FONTNAME",(0,0),(-1,0),"Helvetica-Bold"),("FONTSIZE",(0,0),(-1,0),7),
                  ("BOTTOMPADDING",(0,0),(-1,0),6),("TOPPADDING",(0,0),(-1,0),6),
                  ("FONTNAME",(0,1),(-1,-1),"Helvetica"),("FONTSIZE",(0,1),(-1,-1),7),
                  ("BOTTOMPADDING",(0,1),(-1,-1),5),("TOPPADDING",(0,1),(-1,-1),5),
                  ("ROWBACKGROUNDS",(0,1),(-1,-1),[WHITE,STRIPE]),
                  ("LINEBELOW",(0,0),(-1,-1),0.3,BORDER),("VALIGN",(0,0),(-1,-1),"MIDDLE"),
              ]))
              return t
          def section_hdr(title, accent):
              t = Table([[cell(f"  {title}", bold=True, color=WHITE, size=9)]], colWidths=[TW])
              t.setStyle(TableStyle([("BACKGROUND",(0,0),(-1,-1),accent),
                  ("TOPPADDING",(0,0),(-1,-1),6),("BOTTOMPADDING",(0,0),(-1,-1),6),
                  ("LEFTPADDING",(0,0),(-1,-1),10)]))
              return t
          def section_block(title, accent, sum_tbl, det_tbl):
              return KeepTogether([Spacer(1,5*mm), section_hdr(title,accent),
                                   Spacer(1,2*mm), sum_tbl, Spacer(1,2*mm), det_tbl])
          def no_rec(n): return [[cell("No records this month.")] + [cell("")]*(n-1)]
          def grp(records, key_fn):
              out = {}
              for r in records:
                  k = key_fn(r); out.setdefault(k, []).append(r)
              return out

          # ── Build PDF ─────────────────────────────────────────────────────────
          doc = SimpleDocTemplate(filename, pagesize=A4, leftMargin=MARGIN, rightMargin=MARGIN,
              topMargin=MARGIN, bottomMargin=MARGIN,
              title=f"COMPANY Monthly Report {month_label}", author="COMPANY Portal Agent")
          story = []

          banner = Table([[cell("COMPANY  Monthly Report", bold=True, color=WHITE, size=18),
                           cell(f"{month_label}\nGenerated {today.strftime('%d %b %Y')}",
                                color=colors.HexColor("#c7d2fe"), size=9, align=TA_RIGHT)]],
                         colWidths=[TW*0.6, TW*0.4])
          banner.setStyle(TableStyle([("BACKGROUND",(0,0),(-1,-1),INDIGO),
              ("TOPPADDING",(0,0),(-1,-1),14),("BOTTOMPADDING",(0,0),(-1,-1),14),
              ("LEFTPADDING",(0,0),(-1,-1),14),("RIGHTPADDING",(0,0),(-1,-1),14),
              ("VALIGN",(0,0),(-1,-1),"MIDDLE")]))
          story.append(banner); story.append(Spacer(1,5*mm))

          BW = TW/3
          def stat_card(label, val, sub, lc):
              t = Table([[cell(label, bold=True, size=7, color=SLATE)],
                         [cell(val, bold=True, size=12, color=lc)],
                         [cell(sub, size=7, color=SLATE)]], colWidths=[BW])
              t.setStyle(TableStyle([("BACKGROUND",(0,0),(-1,-1),STRIPE), ("BOX",(0,0),(-1,-1),0.5,BORDER),
                  ("TOPPADDING",(0,0),(-1,-1),5),("BOTTOMPADDING",(0,0),(-1,-1),5),
                  ("LEFTPADDING",(0,0),(-1,-1),8)]))
              return t
          for row_data in [
              (stat_card("Purchase Orders",fmt(po_total),f"{len(pos)} orders",EMERALD),
               stat_card("Cash Claims",fmt(cc_total),f"{len(ccs)} claims",BLUE),
               stat_card("Staff Claims",fmt(sc_total),f"{len(scs)} claims",PURPLE)),
              (stat_card("PCM Costs",fmt(pcm_total),f"{len(costs)} entries",AMBER),
               stat_card("Leave Days",f"{lv_days:.1f} days",f"{len(leaves)} approved",NAVY),
               stat_card("Total Spend",fmt(grand),"all categories",INDIGO)),
          ]:
              row = Table([list(row_data)], colWidths=[BW,BW,BW])
              row.setStyle(TableStyle([("INNERGRID",(0,0),(-1,-1),0.3,BORDER)]))
              story.append(row); story.append(Spacer(1,2*mm))

          po_g = grp(pos, lambda r: r.get("company_name") or r.get("company_key") or "Unknown")
          story.append(section_block("PURCHASE ORDERS", EMERALD,
              make_table([TW*.55,TW*.2,TW*.25],
                  [cell("Company",bold=True,color=WHITE),cell("# POs",bold=True,color=WHITE,align=TA_RIGHT),cell("Total",bold=True,color=WHITE,align=TA_RIGHT)],
                  [[cell(co),cell(str(len(v)),align=TA_RIGHT),cell(fmt(sum(float(r.get("total_amount")or 0)for r in v)),align=TA_RIGHT,bold=True)]for co,v in sorted(po_g.items())]or no_rec(3)),
              make_table([TW*.18,TW*.1,TW*.27,TW*.12,TW*.18,TW*.15],
                  [cell(h,bold=True,color=WHITE)for h in["PO Number","Date","Supplier","Company","Amount","Status"]],
                  [[cell(p.get("po_number","")),cell(p.get("po_date","")),cell((p.get("supplier_name")or"")[:32]),cell(p.get("company_key","")),cell(fmt(p.get("total_amount",0)),align=TA_RIGHT),badge_cell(p.get("status",""))]for p in sorted(pos,key=lambda x:x.get("po_date",""))]or no_rec(6))))

          cc_g = grp(ccs, lambda r: r.get("company_name") or r.get("company_key") or "Unknown")
          story.append(section_block("CASH CLAIMS", BLUE,
              make_table([TW*.55,TW*.2,TW*.25],
                  [cell("Company",bold=True,color=WHITE),cell("# Claims",bold=True,color=WHITE,align=TA_RIGHT),cell("Total",bold=True,color=WHITE,align=TA_RIGHT)],
                  [[cell(co),cell(str(len(v)),align=TA_RIGHT),cell(fmt(sum(float(r.get("total_amount")or 0)for r in v)),align=TA_RIGHT,bold=True)]for co,v in sorted(cc_g.items())]or no_rec(3)),
              make_table([TW*.18,TW*.1,TW*.22,TW*.17,TW*.18,TW*.15],
                  [cell(h,bold=True,color=WHITE)for h in["Claim #","Date","Claimant","Project","Amount","Status"]],
                  [[cell(c.get("claim_number","")),cell(c.get("submission_date","")),cell((c.get("claimant_name")or"")[:25]),cell((c.get("project")or"")[:18]),cell(fmt(c.get("total_amount",0)),align=TA_RIGHT),badge_cell(c.get("status",""))]for c in sorted(ccs,key=lambda x:x.get("submission_date",""))]or no_rec(6))))

          sc_g = grp(scs, lambda r: r.get("staff_name") or "Unknown")
          story.append(section_block("STAFF CLAIMS", PURPLE,
              make_table([TW*.55,TW*.2,TW*.25],
                  [cell("Staff",bold=True,color=WHITE),cell("# Claims",bold=True,color=WHITE,align=TA_RIGHT),cell("Total",bold=True,color=WHITE,align=TA_RIGHT)],
                  [[cell(n),cell(str(len(v)),align=TA_RIGHT),cell(fmt(sum(float(r.get("total_amount")or 0)for r in v)),align=TA_RIGHT,bold=True)]for n,v in sorted(sc_g.items())]or no_rec(3)),
              make_table([TW*.18,TW*.1,TW*.22,TW*.13,TW*.22,TW*.15],
                  [cell(h,bold=True,color=WHITE)for h in["Claim #","Date","Staff","Company","Amount","Status"]],
                  [[cell(s.get("claim_number","")),cell(s.get("submission_date","")),cell((s.get("staff_name")or"")[:25]),cell(s.get("company_key","")),cell(fmt(s.get("total_amount",0)),align=TA_RIGHT),badge_cell(s.get("status",""))]for s in sorted(scs,key=lambda x:x.get("submission_date",""))]or no_rec(6))))

          lv_g = grp(leaves, lambda r: staff_map.get(r.get("staff_id"), str(r.get("staff_id","?"))))
          story.append(section_block("LEAVE (APPROVED)", SLATE,
              make_table([TW*.55,TW*.2,TW*.25],
                  [cell("Staff",bold=True,color=WHITE),cell("Applications",bold=True,color=WHITE,align=TA_RIGHT),cell("Days",bold=True,color=WHITE,align=TA_RIGHT)],
                  [[cell(n),cell(str(len(v)),align=TA_RIGHT),cell(f"{sum(float(r.get('days')or 0)for r in v):.1f}",align=TA_RIGHT,bold=True)]for n,v in sorted(lv_g.items())]or no_rec(3)),
              make_table([TW*.2,TW*.15,TW*.12,TW*.12,TW*.08,TW*.15,TW*.18],
                  [cell(h,bold=True,color=WHITE)for h in["Staff","Type","Start","End","Days","Status","Remark"]],
                  [[cell(staff_map.get(l.get("staff_id"),str(l.get("staff_id","")))),cell(l.get("type","")),cell(l.get("start_date","")),cell(l.get("end_date","")),cell(str(l.get("days","")),align=TA_RIGHT),badge_cell(l.get("status","")),cell((l.get("remark")or"")[:22])]for l in sorted(leaves,key=lambda x:x.get("start_date",""))]or no_rec(7))))

          pcm_g = grp(costs, lambda r: r.get("company") or "Unknown")
          story.append(section_block("PCM PROJECT COSTS", AMBER,
              make_table([TW*.55,TW*.2,TW*.25],
                  [cell("Company",bold=True,color=WHITE),cell("Entries",bold=True,color=WHITE,align=TA_RIGHT),cell("Total",bold=True,color=WHITE,align=TA_RIGHT)],
                  [[cell(co),cell(str(len(v)),align=TA_RIGHT),cell(fmt(sum(float(r.get("amount")or 0)for r in v)),align=TA_RIGHT,bold=True)]for co,v in sorted(pcm_g.items())]or no_rec(3)),
              make_table([TW*.13,TW*.1,TW*.18,TW*.1,TW*.32,TW*.17],
                  [cell(h,bold=True,color=WHITE)for h in["PV #","Date","Supplier","Project","Description","Amount"]],
                  [[cell(c.get("pv_number","")),cell(c.get("date","")),cell((c.get("supplier")or"")[:22]),cell(c.get("project_no","")),cell((c.get("description")or"")[:45]),cell(fmt(c.get("amount",0)),align=TA_RIGHT)]for c in sorted(costs,key=lambda x:x.get("date",""))]or no_rec(6))))

          story.append(Spacer(1,6*mm))
          story.append(HRFlowable(width="100%", thickness=0.5, color=BORDER))
          story.append(Spacer(1,2*mm))
          story.append(Paragraph(
              f"Auto-generated by COMPANY Portal Agent  ·  {today.strftime('%d %B %Y')}  ·  COMPANY GROUP OF COMPANIES  ·  CONFIDENTIAL",
              ParagraphStyle("f", fontName="Helvetica", fontSize=7, textColor=SLATE, leading=9, alignment=TA_CENTER)))
          doc.build(story)
          print(f"PDF: {filename} ({os.path.getsize(filename):,} bytes)")

          # ── Send via send-receipt edge function (Resend, PDF as attachment) ──
          with open(filename, "rb") as f:
              pdf_b64 = base64.b64encode(f.read()).decode()

          payload = json.dumps({
              "to":            os.environ['REPORT_RECIPIENT'],
              "customer_name": "Admin",
              "receipt_no":    f"Monthly Report — {month_label}",
              "issuer":        "Operations Portal Agent",
              "pdfBase64":     pdf_b64
          }).encode()

          req = urllib.request.Request(
              os.environ['SUPABASE_URL'] + "/functions/v1/send-receipt",
              data=payload,
              headers={"Content-Type": "application/json", "Authorization": f"Bearer {ANON}"},
              method="POST"
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  result = json.loads(resp.read())
                  print(f"Email sent via Resend — id: {result.get('id')}")
          except urllib.error.HTTPError as e:
              print(f"Send failed {e.code}: {e.read().decode()}")
              sys.exit(1)
          PYEOF
