name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
    # Skip deploy when only docs/workflow internals change (optional safety; comment out to always deploy)
  workflow_dispatch: # Allow manual deploy from the Actions tab

# Cancel any in-progress deploy if a newer commit lands
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # v4 supports assets-only Workers (no `main` entry-point); the action's
          # default v3.90 does not and errors with "Missing entry-point".
          wranglerVersion: "4.98.0"
          command: deploy
          # NOTE: Worker secrets (GEMINI_API_KEY, RESEND_API_KEY) are NOT set here.
          # This Worker uses gradual deployments (versions), which makes the action's
          # bulk-secret upload fail with Cloudflare error 10215. Set those two secrets
          # ONCE in the Cloudflare dashboard (Workers & Pages → operation-template → Settings
          # → Variables and Secrets → add as "Secret"). They persist across deploys.
