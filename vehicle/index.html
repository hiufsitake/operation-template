<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" href="../ilogo.PNG" type="image/PNG"> 

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/vendor/supabase-js.min.js"></script>

    <title>Company | Vehicle Management</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .input-box { border: 2px solid #f1f5f9; padding: 0.75rem 1rem; border-radius: 1rem; background: #f8fafc; font-weight: 700; width: 100%; outline: none; transition: all 0.2s; font-size: 0.875rem; }
        .input-box:focus { border-color: #ef4444; background: white; }
        .badge-danger { background: #fef2f2; color: #dc2626; border: 1px solid #fca5a5; }
        .badge-safe { background: #f0fdf4; color: #16a34a; border: 1px solid #86efac; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-24 text-slate-900 font-medium relative">

    <nav class="bg-[#0f172a] text-white p-5 sticky top-0 z-50 shadow-xl border-b-2 border-red-500">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <a href="../index.html" class="p-2 hover:bg-slate-800 rounded-lg text-slate-400 hover:text-white transition-all"><i data-lucide="arrow-left" class="w-5 h-5"></i></a>
                <h1 class="font-black italic text-xl uppercase tracking-tighter leading-none">COMPANY <span class="text-red-500 uppercase text-xs">Vehicles</span></h1>
            </div>
            <div class="flex gap-2">
                <button onclick="manualTriggerReminders()" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-xl font-black text-[10px] uppercase flex items-center gap-2 transition-all shadow-sm border border-slate-700">
                    <i data-lucide="bell" class="w-4 h-4 text-red-400"></i> Check Reminders
                </button>
                <button onclick="openModal()" class="bg-red-500 hover:bg-red-400 text-white px-4 py-2 rounded-xl font-black text-[10px] uppercase flex items-center gap-2 transition-all shadow-sm">
                    <i data-lucide="plus" class="w-4 h-4"></i> Add Vehicle
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-4 mt-6 space-y-6">
        
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-[1.5rem] shadow-sm border border-slate-100 flex items-center gap-4">
                <div class="bg-slate-900 p-3 rounded-xl text-white"><i data-lucide="truck" class="w-5 h-5"></i></div>
                <div><p class="text-[9px] font-black uppercase text-slate-400 tracking-widest">Total Fleet</p><p id="stat-total" class="text-xl font-black text-slate-800">0</p></div>
            </div>
            <div class="bg-white p-4 rounded-[1.5rem] shadow-sm border border-slate-100 flex items-center gap-4">
                <div class="bg-red-100 p-3 rounded-xl text-red-600"><i data-lucide="alert-triangle" class="w-5 h-5"></i></div>
                <div><p class="text-[9px] font-black uppercase text-slate-400 tracking-widest">Expiring &lt; 30 Days</p><p id="stat-expiring" class="text-xl font-black text-red-600">0</p></div>
            </div>
        </div>

        <section class="bg-white p-6 rounded-[2rem] shadow-sm border space-y-4">
            <div class="flex justify-between items-center mb-4">
                <h2 class="font-black uppercase text-[10px] tracking-widest text-slate-400 italic">Fleet Directory</h2>
                <div class="relative w-64">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-2.5 text-slate-400"></i>
                    <input type="text" id="search-input" onkeyup="filterTable()" placeholder="Search Plate or Model..." class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-9 pr-4 py-2 text-xs font-bold outline-none focus:border-red-500 transition-colors">
                </div>
            </div>
            <div class="overflow-x-auto rounded-xl border border-slate-100">
                <table class="w-full text-left whitespace-nowrap">
                    <thead class="bg-slate-50 text-slate-400 text-[9px] uppercase font-black tracking-widest border-b border-slate-100">
                        <tr>
                            <th class="p-4 text-center w-12">No.</th>
                            <th class="p-4 min-w-[120px]">Plate No.</th>
                            <th class="p-4 min-w-[150px]">Car Model</th>
                            <th class="p-4 min-w-[120px]">Road Tax Expiry</th>
                            <th class="p-4 min-w-[150px]">Insurance / NCD</th>
                            <th class="p-4 min-w-[150px]">PIC & Email</th>
                            <th class="p-4 text-center w-24">VOC</th>
                            <th class="p-4 text-center w-24">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="vehicle-table-body" class="divide-y divide-slate-100">
                        <tr><td colspan="8" class="p-8 text-center text-xs text-slate-400 italic">Loading database...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
        <footer class="text-center py-4 mt-6">
        <p class="text-[9px] font-black uppercase tracking-[0.6em] text-slate-400">© 2026 ALL RIGHTS RESERVED.</p>
    </footer>
</main>

    <div id="vehicle-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-[100] p-4">
        <div class="bg-white w-full max-w-2xl rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="bg-slate-900 p-6 flex justify-between items-center text-white shrink-0">
                <div>
                    <h2 id="modal-title" class="font-black italic uppercase tracking-widest text-red-400 text-xs">Add Vehicle</h2>
                </div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white transition-colors"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            
            <div class="p-6 overflow-y-auto space-y-4 flex-1">
                <input type="hidden" id="form-id">
                
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-[9px] font-black uppercase tracking-widest text-slate-400 ml-2">Plate Number *</label>
                        <input type="text" id="form-plate" class="input-box uppercase" placeholder="e.g. QAA 1234 A" required>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[9px] font-black uppercase tracking-widest text-slate-400 ml-2">Car Model *</label>
                        <input type="text" id="form-model" class="input-box" placeholder="e.g. Toyota Hilux" required>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-[9px] font-black uppercase tracking-widest text-slate-400 ml-2">Road Tax Expiry Date *</label>
                        <input type="date" id="form-rt-expiry" class="input-box" onchange="if(!document.getElementById('form-ins-expiry').value) document.getElementById('form-ins-expiry').value = this.value;" required>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[9px] font-black uppercase tracking-widest text-slate-400 ml-2">Road Tax Cost (RM)</label>
                        <input type="number" step="0.01" id="form-rt-cost" class="input-box" placeholder="0.00">
                    </div>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 border-t border-slate-100 pt-4">
                    <div class="space-y-1">
                        <label class="text-[9px] font-black uppercase tracking-widest text-slate-400 ml-2">Insurance Co.</label>
                        <input type="text" id="form-ins-co" class="input-box" placeholder="e.g. Allianz">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[9px] font-black uppercase tracking-widest text-slate-400 ml-2">Ins. Expiry</label>
                        <input type="date" id="form-ins-expiry" class="input-box">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[9px] font-black uppercase tracking-widest text-slate-400 ml-2">Ins. Cost (RM)</label>
                        <input type="number" step="0.01" id="form-ins-cost" class="input-box" placeholder="0.00">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[9px] font-black uppercase tracking-widest text-slate-400 ml-2">NCD (%)</label>
                        <input type="number" step="0.01" id="form-ncd" class="input-box" placeholder="55.00">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 border-t border-slate-100 pt-4">
                    <div class="space-y-1">
                        <label class="text-[9px] font-black uppercase tracking-widest text-slate-400 ml-2">PIC Name</label>
                        <input type="text" id="form-pic" class="input-box" placeholder="Driver / In-Charge">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[9px] font-black uppercase tracking-widest text-slate-400 ml-2">PIC Email (For Reminders)</label>
                        <input type="email" id="form-pic-email" class="input-box" placeholder="driver@example.com">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 border-t border-slate-100 pt-4">
                    <div class="space-y-1">
                        <label class="text-[9px] font-black uppercase tracking-widest text-slate-400 ml-2">Date Purchased</label>
                        <input type="date" id="form-date-purchased" class="input-box">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[9px] font-black uppercase tracking-widest text-slate-400 ml-2">Remarks</label>
                        <input type="text" id="form-remark" class="input-box" placeholder="Any notes...">
                    </div>
                </div>

                <div class="border-t border-slate-100 pt-4">
                    <label class="text-[9px] font-black uppercase tracking-widest text-slate-400 ml-2 mb-2 block">Vehicle Ownership Cert (VOC) - PDF/JPG/PNG</label>
                    <div class="flex gap-2 items-center">
                        <input type="file" id="form-voc-file" accept=".pdf, image/jpeg, image/png" class="text-xs w-full file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-black file:bg-red-50 file:text-red-700 hover:file:bg-red-100 cursor-pointer border-2 border-slate-100 rounded-xl p-1 bg-slate-50">
                        <input type="hidden" id="form-voc-url">
                        <a id="current-voc-link" href="#" target="_blank" class="hidden shrink-0 bg-slate-800 text-white px-3 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-slate-700 transition-all flex items-center gap-1"><i data-lucide="eye" class="w-3 h-3"></i> View Current</a>
                    </div>
                </div>

            </div>

            <div class="p-6 bg-slate-50 border-t border-slate-100 flex gap-3 shrink-0">
                <button onclick="closeModal()" class="flex-1 bg-white border-2 border-slate-200 text-slate-500 font-black py-4 rounded-2xl uppercase tracking-widest text-[10px] hover:border-slate-300 transition-all">Cancel</button>
                <button onclick="renewVehicle()" id="renew-btn" class="hidden flex-1 bg-blue-500 text-white font-black py-4 rounded-2xl uppercase tracking-widest text-[10px] shadow-lg hover:bg-blue-600 transition-all flex justify-center items-center gap-2"><i data-lucide="refresh-cw" class="w-4 h-4"></i> Renew (1 Yr)</button>
                <button onclick="saveVehicle()" id="save-btn" class="flex-1 bg-red-500 text-white font-black py-4 rounded-2xl uppercase tracking-widest text-[10px] shadow-lg hover:bg-red-600 transition-all flex justify-center items-center gap-2"><i data-lucide="save" class="w-4 h-4"></i> Save Record</button>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_EMAILS = ['admin1@example.com', 'admin2@example.com', 'admin3@example.com'];
        let isAuthorized = true;

        // --- SUPABASE KEYS ---
        const SUPABASE_URL = 'https://YOUR_PROJECT_REF.supabase.co';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Approval gate: only admins or staff-table members may use this module.

        // --- EMAIL DESTINATIONS ---
        const COMPANY_EMAIL = "companya@example.com";

        let liveDatabase = []; 

        async function init() {
            lucide.createIcons();
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session && ADMIN_EMAILS.includes(session.user.email)) isAuthorized = true;
            await fetchVehicles();
            setTimeout(() => { autoCheckAndSendReminders() }, 2000);
        }

        async function fetchVehicles() {
            try {
                const { data, error } = await supabaseClient.from('vehicles').select('*').order('road_tax_expiry', { ascending: true });
                if (error) throw error;
                liveDatabase = data || [];
                renderTable();
            } catch (err) { console.error("Database Load Error:", err); }
        }

        function renderTable(dataToRender = liveDatabase) {
            const tbody = document.getElementById('vehicle-table-body');
            tbody.innerHTML = '';
            
            let expiringCount = 0;
            const today = new Date();
            const warningDate = new Date();
            warningDate.setDate(today.getDate() + 30); 

            if (dataToRender.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-8 text-center text-xs text-slate-400 italic">No vehicles found.</td></tr>`;
            } else {
                dataToRender.forEach((v, index) => {
                    let isExpiring = false;
                    let isExpired = false;
                    let expiryStr = '-';
                    if (v.road_tax_expiry) {
                        const expDate = new Date(v.road_tax_expiry);
                        expiryStr = expDate.toLocaleDateString('en-GB');
                        if (expDate < today) {
                            isExpired = true;
                            expiringCount++;
                        } else if (expDate <= warningDate) {
                            isExpiring = true;
                            expiringCount++;
                        }
                    }

                    const insExpiryStr = v.insurance_expiry ? new Date(v.insurance_expiry).toLocaleDateString('en-GB') : expiryStr;

                    const datePurchasedStr = v.date_purchased ? new Date(v.date_purchased).toLocaleDateString('en-GB') : '-';
                    const badgeClass = (isExpiring || isExpired) ? 'badge-danger' : 'badge-safe';
                    const badgeText = isExpired ? 'EXPIRED' : (isExpiring ? 'EXPIRING SOON' : 'ACTIVE');

                    const row = document.createElement('tr');
                    row.className = "hover:bg-slate-50 transition-colors";
                    row.innerHTML = `
                        <td class="p-4 text-[10px] font-bold text-slate-400 text-center">${index + 1}</td>
                        <td class="p-4">
                            <span class="text-[12px] font-black text-slate-800 uppercase tracking-wider bg-slate-100 border border-slate-200 px-3 py-1.5 rounded-lg">${v.plate_number || '-'}</span>
                        </td>
                        <td class="p-4">
                            <p class="text-[11px] font-black text-slate-800 break-words whitespace-normal">${v.car_model || '-'}</p>
                            <p class="text-[9px] text-slate-400 font-bold uppercase mt-1">Purchased: ${datePurchasedStr}</p>
                        </td>
                        <td class="p-4">
                            <div class="flex flex-col gap-1 items-start">
                                <span class="text-[11px] font-black text-slate-800">${expiryStr}</span>
                                <span class="text-[8px] px-2 py-0.5 rounded uppercase font-black tracking-widest ${badgeClass}">${badgeText}</span>
                            </div>
                        </td>
                        <td class="p-4">
                            <p class="text-[10px] font-bold text-slate-600">${v.insurance_company || '-'}</p>
                            <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-1">Exp: ${insExpiryStr} | NCD: ${v.ncd || '0'}%</p>
                        </td>
                        <td class="p-4">
                            <p class="text-[10px] font-bold text-slate-800 whitespace-normal break-words">${v.pic || 'Unassigned'}</p>
                            <p class="text-[9px] text-slate-500 font-medium whitespace-normal break-all">${v.pic_email || '-'}</p>
                        </td>
                        <td class="p-4 text-center">
                            ${v.voc_url ? `<a href="${v.voc_url}" target="_blank" class="inline-block bg-slate-100 text-slate-600 hover:bg-red-50 hover:text-red-600 p-2 rounded-lg transition-all"><i data-lucide="file-text" class="w-4 h-4"></i></a>` : `<span class="text-[9px] text-slate-300 italic">N/A</span>`}
                        </td>
                        <td class="p-4 text-center">
                            <div class="flex justify-center gap-2">
                                <button onclick='editVehicle(${JSON.stringify(v).replace(/'/g, "&#39;")})' class="bg-red-50 text-red-600 hover:bg-red-100 p-2 rounded-lg transition-all"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                                <button onclick="deleteVehicle(${v.id})" class="bg-slate-100 text-slate-500 hover:bg-slate-200 p-2 rounded-lg transition-all"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            }

            document.getElementById('stat-total').innerText = dataToRender.length;
            document.getElementById('stat-expiring').innerText = expiringCount;
            lucide.createIcons();
        }

        function filterTable() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = liveDatabase.filter(v => 
                (v.plate_number && v.plate_number.toLowerCase().includes(query)) ||
                (v.car_model && v.car_model.toLowerCase().includes(query)) ||
                (v.pic && v.pic.toLowerCase().includes(query))
            );
            renderTable(filtered);
        }

        function openModal() {
            document.getElementById('form-id').value = '';
            document.getElementById('form-plate').value = '';
            document.getElementById('form-model').value = '';
            document.getElementById('form-rt-expiry').value = '';
            document.getElementById('form-rt-cost').value = '';
            document.getElementById('form-ins-co').value = '';
            document.getElementById('form-ins-expiry').value = '';
            document.getElementById('form-ins-cost').value = '';
            document.getElementById('form-ncd').value = '';
            document.getElementById('form-pic').value = '';
            document.getElementById('form-pic-email').value = '';
            document.getElementById('form-date-purchased').value = '';
            document.getElementById('form-remark').value = '';
            document.getElementById('form-voc-file').value = '';
            document.getElementById('form-voc-url').value = '';
            
            document.getElementById('current-voc-link').classList.add('hidden');
            document.getElementById('renew-btn').classList.add('hidden'); 
            document.getElementById('modal-title').innerText = "Add Vehicle";
            document.getElementById('vehicle-modal').style.display = 'flex';
        }

        function editVehicle(v) {
            document.getElementById('form-id').value = v.id;
            document.getElementById('form-plate').value = v.plate_number || '';
            document.getElementById('form-model').value = v.car_model || '';
            document.getElementById('form-rt-expiry').value = v.road_tax_expiry || '';
            document.getElementById('form-rt-cost').value = v.road_tax_cost || '';
            document.getElementById('form-ins-co').value = v.insurance_company || '';
            document.getElementById('form-ins-expiry').value = v.insurance_expiry || v.road_tax_expiry || '';
            document.getElementById('form-ins-cost').value = v.insurance_cost || '';
            document.getElementById('form-ncd').value = v.ncd || '';
            document.getElementById('form-pic').value = v.pic || '';
            document.getElementById('form-pic-email').value = v.pic_email || '';
            document.getElementById('form-date-purchased').value = v.date_purchased || '';
            document.getElementById('form-remark').value = v.remark || '';
            document.getElementById('form-voc-file').value = '';
            document.getElementById('form-voc-url').value = v.voc_url || '';

            const vocLink = document.getElementById('current-voc-link');
            if (v.voc_url) {
                vocLink.href = v.voc_url;
                vocLink.classList.remove('hidden');
            } else {
                vocLink.classList.add('hidden');
            }

            document.getElementById('renew-btn').classList.remove('hidden'); 
            document.getElementById('modal-title').innerText = "Edit Vehicle Details";
            document.getElementById('vehicle-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('vehicle-modal').style.display = 'none';
        }

        function renewVehicle() {
            if(!confirm("Are you sure you want to renew this vehicle?\n\nThis will automatically extend the Expiry Date by exactly 1 year.")) return;
            
            const currentExpiry = document.getElementById('form-rt-expiry').value;
            if(!currentExpiry) return alert("Please set a Road Tax Expiry Date first.");

            const date = new Date(currentExpiry);
            date.setFullYear(date.getFullYear() + 1);
            
            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            
            document.getElementById('form-rt-expiry').value = `${yyyy}-${mm}-${dd}`;

            const currentInsExpiry = document.getElementById('form-ins-expiry').value;
            if(currentInsExpiry) {
                const insDate = new Date(currentInsExpiry);
                insDate.setFullYear(insDate.getFullYear() + 1);
                const iY = insDate.getFullYear();
                const iM = String(insDate.getMonth() + 1).padStart(2, '0');
                const iD = String(insDate.getDate()).padStart(2, '0');
                document.getElementById('form-ins-expiry').value = `${iY}-${iM}-${iD}`;
            }
            
            alert("Expiry Date extended to next year!\n\nPlease update the New Insurance/Road Tax Costs if necessary, then click 'Save Record' to apply the changes.");
        }

        async function uploadVOCFile(file) {
            const fileExt = file.name.split('.').pop();
            const fileName = `voc_${Date.now()}.${fileExt}`;
            const filePath = `${fileName}`;
            
            const { error: uploadError } = await supabaseClient.storage.from('vehicles').upload(filePath, file);
            if (uploadError) throw uploadError;

            const { data } = supabaseClient.storage.from('vehicles').getPublicUrl(filePath);
            return data.publicUrl;
        }

        async function saveVehicle() {
            const id = document.getElementById('form-id').value;
            const plate = document.getElementById('form-plate').value.trim();
            const model = document.getElementById('form-model').value.trim();
            const expiry = document.getElementById('form-rt-expiry').value;
            
            if(!plate || !model || !expiry) return alert("Plate Number, Car Model, and Expiry Date are required.");

            const btn = document.getElementById('save-btn');
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Saving...`; 
            btn.disabled = true;
            lucide.createIcons();

            try {
                let vocUrl = document.getElementById('form-voc-url').value;
                const fileInput = document.getElementById('form-voc-file');
                
                if (fileInput.files.length > 0) {
                    vocUrl = await uploadVOCFile(fileInput.files[0]);
                }

                const payload = {
                    plate_number: plate.toUpperCase(),
                    car_model: model,
                    road_tax_expiry: expiry,
                    road_tax_cost: document.getElementById('form-rt-cost').value || null,
                    insurance_company: document.getElementById('form-ins-co').value,
                    insurance_expiry: document.getElementById('form-ins-expiry').value || expiry,
                    insurance_cost: document.getElementById('form-ins-cost').value || null,
                    ncd: document.getElementById('form-ncd').value || null,
                    pic: document.getElementById('form-pic').value,
                    pic_email: document.getElementById('form-pic-email').value,
                    date_purchased: document.getElementById('form-date-purchased').value || null,
                    remark: document.getElementById('form-remark').value,
                    voc_url: vocUrl
                };

                if (id) {
                    const existing = liveDatabase.find(x => x.id == id);
                    if (existing && existing.road_tax_expiry !== expiry) {
                        payload.last_reminder_date = null; 
                    }
                }

                let error;
                if (id) {
                    const res = await supabaseClient.from('vehicles').update(payload).eq('id', id);
                    error = res.error;
                } else {
                    const res = await supabaseClient.from('vehicles').insert(payload);
                    error = res.error;
                }
                
                if (error) throw error;
                closeModal();
                await fetchVehicles();
            } catch (err) {
                alert("Error saving record: " + err.message);
            } finally {
                btn.innerHTML = `<i data-lucide="save" class="w-4 h-4"></i> Save Record`; 
                btn.disabled = false;
                lucide.createIcons();
            }
        }

        async function deleteVehicle(id) {
            if (!isAuthorized) { alert("Action restricted to Administrators only."); return; }
            if(!confirm("Are you sure you want to delete this vehicle record? This action cannot be undone.")) return;
            
            try {
                const { error } = await supabaseClient.from('vehicles').delete().eq('id', id);
                if (error) throw error;
                await fetchVehicles();
            } catch (err) {
                alert("Error deleting record: " + err.message);
            }
        }

        // --- RESEND EDGE FUNCTION CALLER ---
        async function triggerResendEmail(v) {
            const expiryDate = new Date(v.road_tax_expiry).toLocaleDateString('en-GB');
            const toEmails = [COMPANY_EMAIL];
            if (v.pic_email && v.pic_email.trim() !== "") {
                toEmails.push(v.pic_email.trim());
            }

            const payload = {
                to: toEmails,
                plate_number: v.plate_number,
                pic_name: v.pic || 'Driver / In-Charge',
                expiry_date: expiryDate
            };

            const response = await fetch(`${SUPABASE_URL}/functions/v1/send-vehicle-reminder`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json', 
                    'Authorization': `Bearer ${SUPABASE_KEY}` 
                },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                let errorMsg = "Failed to send email";
                try {
                    const errorData = await response.json();
                    errorMsg = errorData.message || JSON.stringify(errorData);
                } catch(e) {}
                alert(`Resend Error for ${v.plate_number}:\n\n${errorMsg}`);
                throw new Error(errorMsg);
            }
        }

        // --- AUTOMATED WEEKLY REMINDER SENDER ---
        async function autoCheckAndSendReminders() {
            const today = new Date();
            const warningDate = new Date();
            warningDate.setDate(today.getDate() + 30);
            
            // Filter vehicles expiring in 30 days
            const expiringVehicles = liveDatabase.filter(v => {
                if (!v.road_tax_expiry) return false;
                
                const expDate = new Date(v.road_tax_expiry);
                if (expDate > warningDate) return false; 
                
                // If a reminder was sent previously, check if it was 7+ days ago
                if (v.last_reminder_date) {
                    const lastSent = new Date(v.last_reminder_date);
                    const diffTime = today - lastSent;
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    if (diffDays < 7) return false; // Do not send if it hasn't been a full week
                }

                return true; 
            });

            for (const v of expiringVehicles) {
                try {
                    await triggerResendEmail(v);
                    
                    // Log the date we sent the email
                    await supabaseClient.from('vehicles').update({ last_reminder_date: new Date().toISOString() }).eq('id', v.id);
                    console.log(`Weekly Auto-Reminder sent via Resend for ${v.plate_number}`);
                } catch (e) {
                    console.error("Failed to send auto-reminder for " + v.plate_number, e);
                }
            }
        }

        // Manual check forces a send regardless of the 7-day rule
        async function manualTriggerReminders() {
            const today = new Date();
            const warningDate = new Date();
            warningDate.setDate(today.getDate() + 30);
            
            const expiringVehicles = liveDatabase.filter(v => {
                if (!v.road_tax_expiry) return false;
                const expDate = new Date(v.road_tax_expiry);
                return expDate <= warningDate; // If it's within 30 days or already expired
            });

            if (expiringVehicles.length === 0) {
                return alert("No vehicles are expiring within the next 30 days.");
            }

            if(!confirm(`Found ${expiringVehicles.length} vehicle(s) expiring soon or expired. Send reminder emails manually via Resend?`)) return;

            let sentCount = 0;
            for (const v of expiringVehicles) {
                try {
                    await triggerResendEmail(v);
                    await supabaseClient.from('vehicles').update({ last_reminder_date: new Date().toISOString() }).eq('id', v.id);
                    sentCount++;
                } catch (e) {
                    console.error("Failed to send manual reminder for " + v.plate_number, e);
                }
            }
            if (sentCount > 0) alert(`Successfully dispatched ${sentCount} reminder emails via Resend.`);
            await fetchVehicles(); 
        }

        window.onload = init;
    </script>
